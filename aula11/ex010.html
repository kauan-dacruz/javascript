<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistemas de Multas</h1>
    Velocidade do carro: <input type="number" id="txtvel"> Km/h
    <input type="button" value="verificar" onclick="calcular()">
    <p id="res">Resultado</p>

    <script>

        function calcular(){
            var txtv = document.getElementById('txtvel')
            var vel = Number(txtv.value)
            var res = document.getElementById('res')
            res.innerHTML = `Sua velocidade é de ${vel} <br>`
            if (vel > 60){
                res.innerHTML += `Vc está <strong>multado</strong> por escesso de velocidade!`
            }
            res.innerHTML += `<p>Dirija sempre com responsabilidade</p>`
        }
    </script>
</body>
</html>
