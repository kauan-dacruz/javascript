<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site</title>
</head>
<style>
    div#a1{
        background-color: aqua;
        width: 200px;
        height: 200px;
       
    }
</style>
<body>
    <div id="a1">
        <h1>Hello, word!</h1>
    </div>
    
    <script>
        var n1 = document.getElementById('a1')
        n1.addEventListener('click', clicar)

        function clicar(){
            n1.innerText = 'Clicou!'
            n1.style.backgroundColor = 'black'
            n1.style.color = 'white'
        }
    </script>
</body>
</html>
